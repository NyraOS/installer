# SPDX-License-Identifier: GPL-3.0-or-later
# cargo deny (CI): licences, advisories and sources of the locked dependencies.

[advisories]
# Known vulnerabilities fail the build (the default); so do unmaintained and yanked crates.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licences only, which GPL-3.0-or-later can include; the crate itself is listed.
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
